<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Critical Care — interactive learning games for acute medicine. Start with the coagulation cascade."
    />
    <title>Critical Care — Learning Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="hub.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="site-header">
      <div class="brand">
        <span class="brand-mark">CC</span>
        <span class="brand-name">Critical Care</span>
      </div>
    </header>

    <main class="hero">
      <p class="hero-brand">Critical Care</p>
      <h1 class="hero-title">Learn the acute pathways by playing.</h1>
      <p class="hero-lead">
        Drag-and-order games for clotting cascades, shock algorithms, and more — built for quick bedside refreshers.
      </p>
    </main>

    <section class="games" aria-labelledby="gamesHeading">
      <div class="games-head">
        <h2 id="gamesHeading">Games</h2>
        <p>Pick a module. New titles appear here as they ship.</p>
      </div>

      <div id="gameGrid" class="game-grid"></div>
    </section>

    <footer class="site-footer">
      <p>Critical Care learning games · open in any modern browser</p>
    </footer>

    <script src="games.js"></script>
    <script src="hub.js"></script>
  </body>
</html>
